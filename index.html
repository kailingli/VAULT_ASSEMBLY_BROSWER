<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VAULT_USSA Project Hub</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      padding: 16px;
      background: #0f1117;
      color: #e6edf3;
      margin: 0;
    }
    .container {
      max-width: 1400px;
      width: 96vw;
      margin: 0 auto;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      overflow: hidden;
    }
    .header {
      padding: 16px 24px;
      border-bottom: 1px solid #30363d;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h2 {
      margin: 0;
      font-size: 20px;
      color: #58a6ff;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .author-tag {
      font-size: 13px;
      color: #8b949e;
      font-weight: 500;
    }
    .lang-btn {
      background: #21262d;
      border: 1px solid #30363d;
      color: #58a6ff;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .lang-btn:hover {
      background: #30363d;
      border-color: #58a6ff;
    }
    .nav-tabs {
      display: flex;
      background: #0d1117;
      border-bottom: 1px solid #30363d;
      padding: 0 24px;
      gap: 8px;
    }
    .tab-btn {
      background: none;
      border: none;
      color: #8b949e;
      padding: 14px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: color 0.15s ease, border-color 0.15s ease;
    }
    .tab-btn:hover {
      color: #c9d1d9;
    }
    .tab-btn.active {
      color: #58a6ff;
      border-bottom-color: #58a6ff;
    }
    .tab-content {
      padding: 24px;
      display: none;
    }
    .tab-content.active {
      display: block;
    }
    .selectors {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #8b949e;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    select {
      width: 100%;
      background: #21262d;
      border: 1px solid #30363d;
      color: #f0f6fc;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }
    select:focus {
      border-color: #58a6ff;
    }
    .section-title {
      font-size: 13px;
      font-weight: 700;
      color: #f0883e;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 28px 0 12px;
    }
    .item-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .file-card {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .file-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow: hidden;
    }
    .file-name {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 14px;
      font-weight: 600;
      color: #7ee787;
      text-decoration: none;
    }
    .file-name:hover {
      text-decoration: underline;
    }
    .file-path {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      color: #8b949e;
    }
    .qty-tag {
      background: #1f6feb26;
      color: #58a6ff;
      border: 1px solid #388bfd4d;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }
    .hardware-card {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 14px 18px;
      font-size: 14px;
      color: #c9d1d9;
      line-height: 1.6;
    }
    details {
      margin-top: 24px;
      border: 1px solid #30363d;
      border-radius: 8px;
      background: #0d1117;
      padding: 14px 16px;
    }
    summary {
      font-size: 13px;
      font-weight: 700;
      color: #f0883e;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      outline: none;
    }
    summary:hover {
      color: #58a6ff;
    }
    details[open] summary {
      margin-bottom: 14px;
    }

    .group-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .group-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #21262d;
      padding-bottom: 8px;
    }
    .group-title {
      font-size: 13px;
      font-weight: 700;
      color: #d2a8ff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .group-sub-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-left: 8px;
      border-left: 2px solid #30363d;
    }

    .roof-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
      padding: 0;
      margin: 0;
      list-style: none;
    }
    .roof-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: border-color 0.15s ease;
    }
    .roof-card:hover {
      border-color: #58a6ff;
    }
    .roof-visual-box {
      width: 100%;
      height: 110px;
      background: #0d1117;
      border-radius: 6px;
      border: 1px solid #21262d;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .roof-desc {
      font-size: 12px;
      color: #8b949e;
      line-height: 1.4;
      margin: 0;
    }

    .manual-links {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .manual-link-btn {
      background: #21262d;
      border: 1px solid #30363d;
      color: #c9d1d9;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 13px;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .manual-link-btn:hover {
      border-color: #58a6ff;
      color: #58a6ff;
    }
    .manual-link-btn.active-doc {
      background: #1f6feb26;
      border-color: #388bfd;
      color: #58a6ff;
    }
    .pdf-viewer-frame {
      width: 100%;
      height: calc(100vh - 210px);
      min-height: 800px;
      border: 1px solid #30363d;
      border-radius: 8px;
      background: #0d1117;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h2 id="ui-title">VAULT_USSA Project Hub</h2>
    <div class="header-right">
      <span class="author-tag" id="ui-author">by:kl wi ❤️</span>
      <button class="lang-btn" id="lang-toggle" onclick="toggleLanguage()">中文</button>
    </div>
  </div>

  <nav class="nav-tabs">
    <button class="tab-btn active" id="tab-btn-finder" onclick="switchTab('finder', this)">Component Finder</button>
    <button class="tab-btn" id="tab-btn-manuals" onclick="switchTab('manuals', this)">Assembly Manuals</button>
  </nav>

  <!-- TAB 1: FILE RESOLVER -->
  <div id="tab-finder" class="tab-content active">
    <div class="selectors">
      <div>
        <label for="module-type" id="label-type">Module Type</label>
        <select id="module-type" onchange="renderList()"></select>
      </div>
      <div>
        <label for="width" id="label-width">Width Family</label>
        <select id="width" onchange="renderList()"></select>
      </div>
      <div>
        <label for="depth" id="label-depth">Depth (Gridfinity Units)</label>
        <select id="depth" onchange="renderList()"></select>
      </div>
      <div>
        <label for="height" id="label-height">Height</label>
        <select id="height" onchange="renderList()"></select>
      </div>
    </div>

    <!-- 1. SIZE-SPECIFIC -->
    <div class="section-title" id="title-size-files">1. Size-Specific Files To Print</div>
    <ul class="item-list" id="size-files"></ul>

    <!-- 2. UNIVERSAL / MECHANISM -->
    <details>
      <summary id="title-universal">2. Universal Mechanism Files (Click to Expand)</summary>
      <ul class="item-list" id="universal-files"></ul>
    </details>

    <!-- 3. FASTENERS -->
    <div class="section-title" id="title-hardware">3. Fasteners Required</div>
    <div class="hardware-card" id="hardware-spec"></div>

    <!-- 4. STAND-ALONE INTERIOR ORGANIZERS (INSERT THIS) -->
    <details id="interior-details-section">
      <summary id="title-interior">4. Interior Organizers (Baseplate & Grid Dividers - Click to Expand)</summary>
      <ul class="item-list" id="interior-files"></ul>
    </details>

    <!-- 5. ROOFS (DRAWER ONLY) -->
    <details id="roof-details-section">
      <summary id="title-roof-files">5. Roof Options (Top Tier Only - Click to Expand)</summary>
      <ul class="roof-gallery" id="roof-files"></ul>
    </details>
  </div>

  <!-- TAB 2: EMBEDDED ASSEMBLY MANUALS -->
  <div id="tab-manuals" class="tab-content">
    <div class="manual-links">
      <button class="manual-link-btn active-doc" id="mbtn-02" onclick="loadPdf('02_Drawer Assembly.pdf', this)">Drawer Assembly</button>
      <button class="manual-link-btn" id="mbtn-03" onclick="loadPdf('03_Sustainers Assembly.pdf', this)">Sustainers Assembly</button>
      <button class="manual-link-btn" id="mbtn-04" onclick="loadPdf('04_Modifications.pdf', this)">Modifications</button>
      <button class="manual-link-btn" id="mbtn-05" onclick="loadPdf('05_Mounting Instructions.pdf', this)">Mounting Instructions</button>
      <button class="manual-link-btn" id="mbtn-01" onclick="loadPdf('01_Instructions Manual.pdf', this)">Full Instructions Manual</button>
    </div>
    <iframe id="pdf-frame" class="pdf-viewer-frame" src="02_Drawer Assembly.pdf#zoom=page-width"></iframe>
  </div>
</div>

    boltTextSustainer: `<strong>每个工具箱模块所需螺丝:</strong><br>• M4 x 10mm 螺丝: 8 颗<br>• M4 x 14mm 螺丝: 16 颗<br>• M4 x 20mm 螺丝: 7 颗`,

    ],
    widthOptions: [
      { val: 'S', text: 'S (小号)' },
      { val: 'M', text: 'M (中号)' },
      { val: 'L', text: 'L (大号)' },

    ],
    depthOptions: [
      { val: '3', text: '3 单元 (126 mm)' },
      { val: '4', text: '4 单元 (168 mm)' },
      { val: '5', text: '5 单元 (210 mm)' },
      { val: '6', text: '6 单元 (252 mm)' },

    ],

      heavyweight: "重型提手机构，带双侧储物深槽及加固提手。",

function populateDropdowns() {
  const curType = document.getElementById('module-type').value || 'drawers';
  const curW = document.getElementById('width').value || 'S';
  const curD = document.getElementById('depth').value || '3';
  const curH = document.getElementById('height').value || '1F';

  const texts = i18n[currentLang];

  const typeSelect = document.getElementById('module-type');
  typeSelect.innerHTML = texts.typeOptions.map(o => `<option value="${o.val}" ${o.val===curType?'selected':''}>${o.text}</option>`).join('');

  const wSelect = document.getElementById('width');
  wSelect.innerHTML = texts.widthOptions.map(o => `<option value="${o.val}" ${o.val===curW?'selected':''}>${o.text}</option>`).join('');

  const dSelect = document.getElementById('depth');
  dSelect.innerHTML = texts.depthOptions.map(o => `<option value="${o.val}" ${o.val===curD?'selected':''}>${o.text}</option>`).join('');

  const hSelect = document.getElementById('height');
  hSelect.innerHTML = texts.heightOptions.map(o => `<option value="${o.val}" ${o.val===curH?'selected':''}>${o.text}</option>`).join('');
}

function updateStaticText() {
  const t = i18n[currentLang];
  document.getElementById('ui-title').textContent = t.title;
  document.getElementById('ui-author').textContent = t.author;
  document.getElementById('lang-toggle').textContent = t.langToggle;
  document.getElementById('tab-btn-finder').textContent = t.tabFinder;
  document.getElementById('tab-btn-manuals').textContent = t.tabManuals;
  document.getElementById('label-type').textContent = t.labelType;
  document.getElementById('label-width').textContent = t.labelWidth;
  document.getElementById('label-depth').textContent = t.labelDepth;
  document.getElementById('label-height').textContent = t.labelHeight;
  document.getElementById('title-size-files').textContent = t.titleSizeFiles;
  document.getElementById('title-hardware').textContent = t.titleHardware;
  document.getElementById('title-interior').textContent = t.titleInterior;
  document.getElementById('title-roof-files').textContent = t.titleRoofFiles;

  document.getElementById('mbtn-02').textContent = t.mbtn02;
  document.getElementById('mbtn-03').textContent = t.mbtn03;
  document.getElementById('mbtn-04').textContent = t.mbtn04;
  document.getElementById('mbtn-05').textContent = t.mbtn05;
  document.getElementById('mbtn-01').textContent = t.mbtn01;
}

function toggleLanguage() {
  currentLang = currentLang === 'en' ? 'zh' : 'en';
  updateStaticText();
  populateDropdowns();
  renderList();
}

function switchTab(tabName, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  
  btn.classList.add('active');
  document.getElementById(`tab-${tabName}`).classList.add('active');
}

function loadPdf(pdfFilename, btn) {
  document.querySelectorAll('.manual-link-btn').forEach(b => b.classList.remove('active-doc'));
  if (btn) {
    btn.classList.add('active-doc');
  }
  document.getElementById('pdf-frame').src = encodeURI(pdfFilename) + '#view=FitH&toolbar=1';
}

function buildCards(list) {
  return list.map(item => `
    <li class="file-card">
      <div class="file-info">
        <a class="file-name" href="${encodeURI(item.path)}" download>${item.name}</a>
        <span class="file-path">${item.path}</span>
      </div>
      <span class="qty-tag">${item.qty}</span>
    </li>
  `).join('');
}

function renderList() {
  const type = document.getElementById('module-type').value || 'drawers';
  const w = document.getElementById('width').value || 'S';
  const d = document.getElementById('depth').value || '3';
  const h = document.getElementById('height').value || '1F';
  const wd = `${w}${d}`;
  const t = i18n[currentLang];

  if (type === 'drawers') {
    document.getElementById('roof-details-section').style.display = 'block';
    document.getElementById('title-universal').textContent = t.titleUniversalDrawer;
    document.getElementById('interior-details-section').style.display = 'block'; 


    const famPrefix = w === 'S' ? '01. S Families' :
                      w === 'M' ? '02. M Families' :
                      w === 'L' ? '03. L Families' : '05. XL Families';

    const runnerFolder = (w === 'XL') 
      ? '01. DRAWERS/07. Universal/Runners/XL Runners' 
      : '01. DRAWERS/07. Universal/Runners';
    const runnerPrefix = (w === 'XL') ? `XL${d}` : `x${d}`;

    // 1. Size-Specific Files
    const sizeItems = [
      { name: `${wd} Module ${h}.stl`, path: `01. DRAWERS/${famPrefix}/${wd}/Modules/${wd} Module ${h}.stl`, qty: "x1" },
      { name: `${wd} Box ${h}.stl`, path: `01. DRAWERS/${famPrefix}/${wd}/Boxes/${wd} Box ${h}.stl`, qty: "x1" },
      { name: `${w}${h} (Turn On Supports).stl`, path: `01. DRAWERS/${famPrefix}/Facades/${w}${h} (Turn On Supports).stl`, qty: "x1" },
      { name: `${w} Rails.stl`, path: `01. DRAWERS/07. Universal/Geared Rails/${w} Rails.stl`, qty: "x2" },
      { name: `${runnerPrefix} Runner Guide.stl`, path: `${runnerFolder}/${runnerPrefix} Runner Guide.stl`, qty: "x2" },
      { name: `${runnerPrefix} Runner Slide.stl`, path: `${runnerFolder}/${runnerPrefix} Runner Slide.stl`, qty: "x2" }
    ];

    // 2. Universal Mechanism Files
    const universalItems = [
